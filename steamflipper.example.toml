# steamflipper.toml — SteamFlipper configuration
# Place at: <Steam>/steamflipper.toml
# This file is loaded at startup and hot-reloaded after changes.

[log]
# Log verbosity for all log files (Debug build only).
# Valid: trace, debug, info, warn, error
level = "debug"

[manifest]
# Which upstream API to query for depot manifest request codes.
#   "steamflipper" → https://manifest.opensteamtool.com/{gid}   (default)
#   "wudrm"         → http://gmrc.wudrm.com/manifest/{gid} (recommended for China users)
#   "steamrun"      → https://manifest.steam.run/api/manifest/{gid}
# If <Steam>/config/stplug-in/manifest.lua defines fetch_manifest_code(gid) or
# fetch_manifest_code_ex(app_id, depot_id, gid), those Lua functions take
# priority over the url setting below.
#
# --- manifest.lua reference ---
# The C++ side provides http_get(url [, headers]) and
# http_post(url, body [, headers]) to Lua scripts.  Both return
# (body_string, status_code) on success, or (nil, error_msg) on failure.
#
# -- Example: try wudrm (plain-text uint64), fall back to steamrun (JSON).
# -- Return a digit *string* to avoid double-precision loss > 2^53.
# function fetch_manifest_code(gid)
#     -- wudrm responds with e.g. "10570517747114638659"
#     local body, st = http_get("http://gmrc.wudrm.com/manifest/" .. gid)
#     if st == 200 and body then return body end
#     -- steamrun responds with {"content":"1666836470726104466"}
#     body, st = http_get("https://manifest.steam.run/api/manifest/" .. gid)
#     if st == 200 and body then
#         local code = body:match('"content":"(%d+)"')
#         if code then return code end
#     end
#     return nil
# end
#
# -- Extended variant with app_id and depot_id:
# function fetch_manifest_code_ex(app_id, depot_id, gid)
#     local body, st = http_get("https://your-api.com/manifest-code/" .. app_id .. "/" .. gid)
#     if st == 200 and body and body:match("^%d+$") then
#         return body
#     end
#     return nil
# end
url = "opensteamtool"

# HTTP timeouts for manifest requests (milliseconds).
# timeout_resolve_ms  — DNS resolution        (default: 5000)
# timeout_connect_ms  — TCP handshake          (default: 5000)
# timeout_send_ms     — request transmission   (default: 10000)
# timeout_recv_ms     — response body download (default: 10000)
timeout_resolve_ms = 5000
timeout_connect_ms = 5000
timeout_send_ms    = 10000
timeout_recv_ms    = 10000

[stats]
# Automatically query https://stats.steamflipper.com/{appid} for a recommended
# SteamID when no Lua setStat(appid, "steamid") override exists.
# Priority: setStat > stats API when enabled and valid > hardcoded preset SteamID.
enable_api = true

[diagnostics]
# Show a desktop popup when a signature or IPC spec cannot be found for the
# running Steam build ("Unsupported Steam Version", "IPC spec missing",
# "Missing Signatures"). These are published per steamclient hash upstream.
#
# Set to false if your Steam build has no published spec yet — otherwise the
# same unactionable popups appear on every launch. The warnings are still
# written to the log either way (Debug build only).
#
# Note for Linux: no specs are published for the Linux steamclient.so /
# steamui.so hashes, so leaving this on means popups every single launch.
popups = true

[update]
# Check for a newer SteamFlipper on startup. Set to false to disable the check
# (and the Config page's update panel) entirely.
#
# Windows downloads a newer build, verifies it (SHA-256) and stages it next to
# Steam; the new DLL loads on the next Steam launch.
#
# Linux has no release artifact to fetch: the module is built on this machine
# by tools/install_linux.sh. So the check compares the commit this build came
# from against the head of that branch on GitHub and reports the difference in
# the log. Nothing is downloaded and nothing is written.
enabled = true

# Linux only, and only needed to act on that check. The SteamFlipper source
# checkout this install was built from — the installed module sits under
# ~/.local/lib and carries no pointer back to the tree, so it cannot be
# guessed. With this set, the Config page's "Update source" button runs
# `git pull --ff-only` here; it refuses on a dirty tree and never resets,
# stashes or forces. The rebuild stays a deliberate step:
#     cd <repo> && ./tools/install_linux.sh     (with Steam closed)
# repo = "/home/you/src/SteamFlipper"

# Additional Lua config directories (optional).
# Files are loaded after the default <Steam>/config/stplug-in folder.
# The default folder is always loaded last so user files take priority.
# Example — load a custom directory on another drive:
#   [lua]
#   paths = ["D:/my-steam-config/lua"]
[lua]
# paths = []

# Optional library injection into game processes. Each [[inject]] entry is loaded
# when every condition it sets matches the launch.
# Example:
#   [[inject]]
#   path = "SteamFlipperHook.dll"      # bare name resolves next to steam.exe; absolute path used as-is
#   when_cmdline = "-my_special_hook"   # optional: require this substring in the launch command (default: any)
#   when_appids = [1361510]             # optional: restrict to these appids (default: any)
#   all_games = false                   # optional: true injects into every game, false only into Lua-added games (default: false)

[cloud]
# Optional Steam Cloud save redirection for unlocked ("lua") games, powered by
# CloudRedirect (https://github.com/Selectively11/CloudRedirect).
# When enabled, SteamFlipper loads cloud_redirect.dll inside Steam, registers
# every addappid() game as a redirected app, and routes their Steam Cloud RPCs
# through CloudRedirect's cloud-save engine.
#
# Provider sign-in (Google Drive / OneDrive / local folder) is still done through
# CloudRedirect's own companion app — SteamFlipper only hosts the DLL.
enabled = false
# Path to cloud_redirect.dll. Absolute, or relative to the Steam root directory.
# Defaults to "<Steam>/cloud_redirect.dll" when unset.
# library = "cloud_redirect.dll"

[remote]
# Optional metadata mirror(s). Leave unset to use the built-in mirror chain,
# which is tried in order until one responds:
#   1. https://raw.githubusercontent.com/OpenSteam001/steam-monitor/{channel}/{component}/{sha256}.toml
#   2. https://cdn.jsdelivr.net/gh/OpenSteam001/steam-monitor@{channel}/{component}/{sha256}.toml
#   3. https://raw.githubusercontent.com/madoiscool/steam-monitor/{channel}/{component}/{sha256}.toml
#   4. https://cdn.jsdelivr.net/gh/madoiscool/steam-monitor@{channel}/{component}/{sha256}.toml
#   5. https://git.lua.tools/luatools/steam-monitor/raw/branch/{channel}/{component}/{sha256}.toml
#
# url_template may be a single string OR an array of strings. When set, it
# REPLACES the built-in chain (the built-ins are not tried). Each entry must
# contain all three placeholders: {channel}, {component}, and {sha256}.
#
# Single custom mirror:
# url_template = "https://your.server/{channel}/{component}/{sha256}.toml"
#
# Multiple fallbacks (tried top to bottom):
# url_template = [
#   "https://git.lua.tools/luatools/steam-monitor/raw/branch/{channel}/{component}/{sha256}.toml",
#   "https://raw.githubusercontent.com/madoiscool/steam-monitor/{channel}/{component}/{sha256}.toml",
# ]
